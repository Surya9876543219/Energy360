command:
  - streamlit
  - run
  - app.py
  - --server.address
  - 0.0.0.0
  - --server.port
  - "8000"

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: ENERGY360_CATALOG
    value: "energy"
  - name: ENERGY360_SCHEMA
    value: "energy"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
